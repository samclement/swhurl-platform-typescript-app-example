name: Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: meta
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          sha_tag="${GITHUB_SHA}"
          short_sha_tag="${GITHUB_SHA::12}"
          {
            echo "image=${image}"
            echo "sha_tag=${sha_tag}"
            echo "short_sha_tag=${short_sha_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          image="${{ steps.meta.outputs.image }}"
          sha_tag="${{ steps.meta.outputs.sha_tag }}"
          short_sha_tag="${{ steps.meta.outputs.short_sha_tag }}"

          buildah bud \
            --format docker \
            --tls-verify=true \
            --build-arg NPM_CONFIG_LOGLEVEL=error \
            -f ./Dockerfile \
            -t "${image}:${sha_tag}" \
            .
          buildah tag "${image}:${sha_tag}" "${image}:${short_sha_tag}"

      - name: Push image
        run: |
          image="${{ steps.meta.outputs.image }}"
          podman push "${image}:${{ steps.meta.outputs.sha_tag }}" --tls-verify=true
          podman push "${image}:${{ steps.meta.outputs.short_sha_tag }}" --tls-verify=true
